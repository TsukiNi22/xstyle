# xstyle documentation site (better-html-doc) - build: python3 ~/.claude/skills/better-html-doc/scripts/build_site.py --site docs/site --out docs
# The built pages are committed in docs/ (published on gh-pages by docs.yml); gen/*.py read the rules and options from ./xstyle (build it first)

[site]
name = "xstyle"
langs = ["en", "fr"]
repo = "https://github.com/TsukiNi22/xstyle"
edit_url = ""
pages_url = "https://tsukini22.github.io/xstyle/docs/"
storage_key = "xstyle-docs"
logo = "../logo.svg"

[home]
title = { en = "xstyle documentation", fr = "Documentation de xstyle" }
tagline = { en = "Checker and fixer of the coding style of TsukiNi22: C++20 and libutils first, then C, assembly (NASM), Python, shell, Rust, CMake and the generic rules of every language.", fr = "Vérificateur et correcteur du style de code de TsukiNi22 : C++20 et libutils d'abord, puis C, assembleur (NASM), Python, shell, Rust, CMake et les règles génériques de tous les langages." }
changelog = "../../CHANGELOG.md"
links = [
    { href = "getting-started.html", text = { en = "Getting started", fr = "Premiers pas" } },
